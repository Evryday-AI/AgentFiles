# Complete alternative, not an override of compose.yaml. No database service.
services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentfiles-local:0.1.0
    env_file: .env
    environment:
      DATABASE_URL: '${DATABASE_URL:?Provide an independently owned database URL}'
      PORT: '3000'
      STORAGE_ROOT: /data/storage
    command: [node, dist/server/migrate.js]
    restart: 'no'
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentfiles-local:0.1.0
    env_file: .env
    environment:
      DATABASE_URL: '${DATABASE_URL:?Provide an independently owned database URL}'
      PORT: '3000'
      STORAGE_ROOT: /data/storage
    command: [node, dist/server/index.js, '--host=0.0.0.0']
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    volumes:
      - storage:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/ready',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    stop_grace_period: 15s
    restart: unless-stopped
volumes:
  storage:

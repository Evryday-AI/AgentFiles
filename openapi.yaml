          format: date-time
        expiresAt:
          type: string
          format: date-time
        max_downloads:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 2147483647
        maxDownloads:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 2147483647
      required: []

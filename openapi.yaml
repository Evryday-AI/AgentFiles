          type: string
          format: uuid
        name:
          type: string
        canUpload:
          type: boolean
        canDownload:
          type: boolean
        canList:
          type: boolean
        canDelete:
          type: boolean
        canMarkDurable:
          type: boolean
        canShare:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastUsedAt:

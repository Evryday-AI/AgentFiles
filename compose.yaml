services:
  db:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_USER: agentfiles
      POSTGRES_DB: agentfiles
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?Run administrator setup first}'
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentfiles-local:0.1.0
    env_file: .env
    environment:
      PORT: '3000'
      STORAGE_ROOT: /data/storage
    command: [node, dist/server/migrate.js]
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentfiles-local:0.1.0
    env_file: .env
    environment:
      PORT: '3000'
      STORAGE_ROOT: /data/storage
    command: [node, dist/server/index.js, '--host=0.0.0.0']
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/ready',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    stop_grace_period: 15s
    restart: unless-stopped
volumes:
  database:
  storage:

name: Bug report
description: Report a reproducible problem using synthetic files and redacted diagnostics.
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities belong in [private reporting](https://github.com/Evryday-AI/AgentFiles/security/advisories/new).
        Never include real keys, passwords, cookies, public share tokens, uploaded file contents, environment files, private paths or deployment addresses.
  - type: input
    id: revision
    attributes:
      label: Revision and environment
      description: Commit/version, OS/architecture, Node or Docker/Compose versions, browser if relevant. Omit private host names and paths.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Synthetic reproduction
      description: Steps using newly generated non-sensitive fixtures; expected and observed behavior.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Minimal status codes or error categories. Remove credentials, tokens, filenames and local paths before posting.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains only synthetic fixtures and redacted diagnostics, with no real secrets or file contents.
          required: true
